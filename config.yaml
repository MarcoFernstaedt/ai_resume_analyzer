profile:
  name: "Marco Fernstaedt"
  target_titles:
    - "Frontend Developer"
    - "Full Stack Developer"
    - "React Developer"
    - "JavaScript Developer"
    - "Software Engineer"
    - "Web Developer"
  must_have_skills:
    - "React"
    - "JavaScript"
  nice_to_have_skills:
    - "Next.js"
    - "Node.js"
    - "TypeScript"
    - "TailwindCSS"
    - "MongoDB"
    - "PostgreSQL"
    - "Python"
    - "Socket.io"
  exclude_keywords:
    - "Senior"
    - "Staff"
    - "Lead"
    - "Principal"
    - "10+ years"
    - "8+ years"
    - "7+ years"
    - "clearance required"
  remote_preference: "remote"
  locations:
    - "Phoenix"
    - "Scottsdale"
    - "Remote"
  min_salary: 60000
  max_experience_years: 4

search:
  indeed:
    enabled: true
    queries:
      - "React Developer remote"
      - "Frontend Developer remote"
      - "Full Stack Developer remote"
      - "JavaScript Developer remote"
      - "Junior Software Engineer remote"
    pages_per_query: 5

scraping:
  headless: true
  delay_between_pages_seconds: 4
  delay_between_requests_seconds: 2
  max_jobs_per_run: 75
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

tailor:
  model: "claude-sonnet-4-6"
  max_tokens: 600
